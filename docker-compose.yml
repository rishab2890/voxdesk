services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voxdesk
      POSTGRES_PASSWORD: voxdesk
      POSTGRES_DB: voxdesk
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxdesk"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrantdata:/qdrant/storage]

  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://voxdesk:voxdesk@postgres:5432/voxdesk
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      qdrant: { condition: service_started }
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://voxdesk:voxdesk@postgres:5432/voxdesk
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    depends_on: [api]
    command: python -m app.worker

  # Self-hosted Dograh voice engine. Uncomment and point DOGRAH_URL at it
  # once you deploy it (see https://github.com/dograh-hq/dograh).
  # dograh:
  #   image: dograh/dograh:latest
  #   ports: ["8010:8010"]
  #   env_file: .env

volumes:
  pgdata:
  qdrantdata:
