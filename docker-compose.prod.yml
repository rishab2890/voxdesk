# Production overlay: adds Caddy for automatic HTTPS in front of the API.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Requires API_DOMAIN in .env (e.g. api.yourdomain.com) with DNS pointing here.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [api]

  api:
    restart: unless-stopped
  worker:
    restart: unless-stopped
  postgres:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  qdrant:
    restart: unless-stopped

volumes:
  caddydata:
